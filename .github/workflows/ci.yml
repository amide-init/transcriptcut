name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (server)
        working-directory: server
        run: bunx prisma generate

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          # Not required for the build itself (lib/ai/{transcribe,filler-words}.ts
          # construct their OpenAI client lazily, only on first real call --
          # nothing at build time imports/executes that code) -- kept as
          # defense-in-depth in case that ever regresses. Not a real secret,
          # no API calls happen during build.
          OPENAI_API_KEY: dummy-key-for-ci-build-only
