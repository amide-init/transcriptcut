name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          # Not required anymore (lib/ai/{transcribe,filler-words}.ts now
          # construct their OpenAI client lazily on first call, not at
          # module load, so `next build` succeeds even with this unset) --
          # kept as defense-in-depth against that regressing back to eager
          # construction. Not a real secret, no API calls happen during build.
          OPENAI_API_KEY: dummy-key-for-ci-build-only
