# docker compose up --build, then open http://localhost:3001
name: transcriptcut

services:
  app:
    build: .
    # Bound to this machine only: there's no login (claude.md section 18),
    # so don't publish it to a shared network without adding auth first.
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - transcriptcut-data:/data
    # Optional: OPENAI_API_KEY (and MAX_UPLOAD_MB) from the same root .env
    # the dev server uses. Without one, the app asks for the key on first
    # launch.
    env_file:
      - path: .env
        required: false
    # Pinned over anything in .env, whose dev values (relative paths, a
    # Homebrew FFMPEG_PATH) don't exist inside the container.
    environment:
      PORT: "3001"
      DATA_DIR: /data
      DATABASE_URL: file:/data/app.db
      CLIENT_DIST_DIR: /app/client-dist
      FFMPEG_PATH: /usr/local/bin/ffmpeg
      FFPROBE_PATH: /usr/local/bin/ffprobe
    restart: unless-stopped

volumes:
  transcriptcut-data:
    # Fixed name, so it doesn't depend on the folder the repo is cloned into.
    name: transcriptcut-data
